title = "tsacl gitleaks config"

[extend]
useDefault = true

# The tests assert the CLIs never echo an API key from the environment, so they
# plant a placeholder key. Allowlist only that placeholder, only in those tests.
# The tail-acl path keeps pre-rename history clean, since gitleaks scans every commit.
[[allowlists]]
description = "placeholder API key in the no-secret-in-output tests"
condition = "AND"
paths = ['''cmd/(acl-upload|tsacl|tail-acl)/main_test\.go''']
regexes = ['''tskey-api-SE''']

# Tailscale credentials. The default ruleset has no Tailscale rule. Real keys
# are tskey-<kind>-<id>-<secret>; the placeholders in tests lack the second
# segment, so they do not match.
[[rules]]
id = "tailscale-key"
description = "Tailscale API, auth, OAuth client, SCIM or webhook key"
regex = '''tskey-(?:api|auth|client|scim|webhook)-[A-Za-z0-9]{8,}-[A-Za-z0-9]{20,}'''
keywords = ["tskey-"]

# A real MagicDNS name identifies a tailnet. Only example.ts.net is allowed in
# fixtures, docs and tests.
[[rules]]
id = "tailnet-dns-name"
description = "MagicDNS name other than example.ts.net"
regex = '''\b[a-z0-9][a-z0-9-]*\.ts\.net\b'''
keywords = [".ts.net"]
[[rules.allowlists]]
regexes = ['''(?i)example\.ts\.net''']

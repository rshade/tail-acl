name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@v5

      - name: Scan for live credentials
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
        run: mise run scan-trufflehog

  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@v5

      - name: Scan for secret patterns
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: mise run scan-gitleaks

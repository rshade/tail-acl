# release-please owns the vX.Y.Z tag, changelog and GitHub Release object; the
# release workflow builds with `--skip=publish` and attaches dist/ to that
# release with `gh release upload`.
# Local smoke test: `mise run release-check`.
version: 2

project_name: tail-acl

builds:
  - id: tail-acl
    main: ./cmd/tail-acl
    binary: tail-acl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: hujson-merge
    main: ./cmd/hujson-merge
    binary: hujson-merge
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: acl-upload
    main: ./cmd/acl-upload
    binary: acl-upload
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true
